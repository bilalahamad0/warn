name: WARN Monitor & Dashboard Update

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    # Allows manual triggering from the Actions tab

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Core testing and formatting tools
          pip install black pytest-mock pytest-cov python-dotenv

      - name: Run logic tests
        env:
          PYTHONPATH: .
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          # Ensure directories exist for the structure tests
          mkdir -p data/historical/pdfs docs/charts
          pytest -v --cov=.

      - name: Run WARN Update Pipeline
        id: pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          # Signup form endpoint (public Apps Script URL) — repo variable, not secret
          SIGNUP_ENDPOINT: ${{ vars.SIGNUP_ENDPOINT }}
          # Shared token to read the subscriber list (matches Apps Script LIST_TOKEN)
          SUBSCRIBERS_TOKEN: ${{ secrets.SUBSCRIBERS_TOKEN }}
          # X / @USLayoff. Unset is safe: warn_x degrades to composing and
          # queueing candidates into data/x_queue.json and sends nothing, which
          # is exactly the review-gate phase. The queue is committed by the step
          # below (it stages data/), so the operator reviews and posts from a
          # local checkout without any secret ever reaching this workflow.
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Repository VARIABLES, not secrets — these are the gate and the
          # kill switch, and both need to be flippable without a deploy.
          # 'dry' in CI, always: a GitHub runner has no browser and no
          # logged-in x.com session, so it composes and queues only. The
          # operator posts from a local checkout, where the default is
          # 'browser'. Set the repo variable to override.
          X_TRANSPORT: ${{ vars.X_TRANSPORT || 'dry' }}
          X_AUTO_POST: ${{ vars.X_AUTO_POST }}
          X_DISABLE_POSTING: ${{ vars.X_DISABLE_POSTING }}
          X_INCLUDE_LINK: ${{ vars.X_INCLUDE_LINK }}
        run: |
          # We run the consolidated publish script
          # --no-push allows the Action to handle Git operations safely
          python3 warn_publish.py --no-push

      - name: Commit and push changes
        # Runs on pipeline success AND pipeline failure — but only when the
        # pipeline step actually ran. A failed run has already sent its alert
        # emails (warn_publish raises on a root-site build failure only AFTER
        # the notifications go out), and the ledgers recording those sends
        # (data/notified_keys.json, amended_keys.json, digest_sent.json, and
        # data/states/*) exist only in this throwaway workspace. Discarding
        # them re-emails every subscriber the same notices next run. The
        # outcome gate keeps a totally-failed run (dependency install or test
        # failure — pipeline outcome 'skipped') from committing garbage.
        if: ${{ !cancelled() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure') }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ "${{ steps.pipeline.outcome }}" = "success" ]; then
            # Full publish: data and the rebuilt site.
            git add data/ docs/
            MSG="auto: WARN data update [skip ci]"
          else
            # Root site build failed: persist ONLY the alert ledgers so
            # already-sent alerts are never re-emailed. docs/ stays
            # uncommitted — the last good page remains published.
            git add data/
            MSG="auto: alert ledgers (pipeline failed) [skip ci]"
          fi

          # Only commit/push if there are actual changes staged
          if ! git diff --cached --quiet; then
            git commit -m "$MSG"
            git push
          else
            echo "No changes to commit"
          fi

  publish:
    # The alert emails have gone out and the build is on main; neither means
    # anyone can SEE it. From 2026-09-17 to 2026-10-02 every deploy queued
    # behind one stuck Deploy Pages run, and both dashboards sat on 2026-09-16
    # while this workflow stayed green and kept emailing. So the run that
    # sends an alert also puts the matching build on the live site: dispatch
    # pages.yml, cancel any stuck deploy, wait until the public data.json files
    # carry this build's stamp, retry once. If the site still lags, this job
    # goes red and GitHub emails the owner.
    #
    # Its own job, so "Re-run failed jobs" retries the publish ALONE.
    # Re-running update-dashboard replays the pipeline from the commit this
    # run started on, whose alert ledgers predate the emails it already sent,
    # so every subscriber would get them again.
    #
    # `needs` skips this unless update-dashboard fully succeeded: a failed
    # pipeline commits data/ alone (no new site to put live), and a failed push
    # leaves nothing new on main for the deploy to pick up.
    needs: update-dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write      # dispatch pages.yml, cancel stuck Deploy Pages runs
    steps:
      - name: Checkout main as just pushed
        uses: actions/checkout@v6
        with:
          # NOT github.sha, which is the commit this run STARTED from, before
          # its own push. That docs/ is older than the live site, so it would
          # always read as "in sync". The build to verify is the branch tip.
          ref: ${{ github.ref_name }}

      - name: Publish the site and verify it is live
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 warn_site_check.py --publish
