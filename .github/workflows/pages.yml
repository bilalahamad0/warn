# Deploys docs/ to GitHub Pages.
#
# This repo used the branch-based ("legacy") Pages build until August 2026,
# and it failed routinely: builds wedged at duration 0 and needed a manual
# POST /pages/builds to unstick, one deploy hit a duplicate-artifact race
# ("Multiple artifacts named github-pages"), and others were cancelled
# mid-deploy — leaving main updated while the live site silently served stale
# content. Being GitHub-managed, that workflow offered nothing to configure,
# queue, or retry. This workflow replaces it (Settings ▸ Pages ▸ Source must
# be "GitHub Actions"), so deploys are ordinary runs: visible, re-runnable,
# and serialised through the concurrency group below.
#
# Triggers:
#   push               Human merges. Filtered to docs/** because only docs/
#                      is the site — a code-only merge has nothing to deploy.
#   workflow_dispatch  How the twice-daily pipeline publishes. monitor.yml's
#                      [skip ci] commits can never fire `push`, so after
#                      committing it runs `warn_site_check.py --publish`,
#                      which dispatches this workflow BY FILE NAME and waits
#                      until the live site serves the new build (failing the
#                      monitor run if it never does). site-watchdog.yml does
#                      the same every two hours for anything else that falls
#                      behind. Events raised with a GITHUB_TOKEN start no
#                      runs, except workflow_dispatch and repository_dispatch,
#                      so this trigger must stay. It is also the manual
#                      button: Actions ▸ Deploy Pages ▸ Run workflow.
#
# This used to trigger on `workflow_run` after the pipeline completed. That
# could not be verified from the pipeline, because its run had to finish
# before the deploy could start. When a deploy stalled, nothing noticed; see
# the concurrency note below.

name: Deploy Pages

on:
  push:
    branches: [ "main" ]
    paths: [ "docs/**" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer run replaces a *pending* one (the queue holds
# at most one), but never cancels a deploy in progress. Cancelling
# actions/deploy-pages mid-flight can leave the Pages deployment marked
# in progress: its only cleanup is a best-effort signal handler. Every later
# deploy then fails with "due to in progress deployment" (deploy-pages#22,
# #118). That is why GitHub's own Pages starter workflow is also false.
#
# The flip side is the 2026-09-17 outage. Run 35175481498 sat in "waiting" on
# the github-pages environment for 15 days (no reviewers, no wait timer, a
# branch policy main passes). It held this group, and each later deploy
# queued as "pending" behind it until the next one replaced it. Neither
# setting here fixes that. `true` is not documented to reach a run that is
# waiting on an environment, and a staff-acknowledged report says it does
# not. `timeout-minutes` does not count time spent waiting on an environment
# either, and GitHub's own cap is 30-35 days. What does work is an explicit
# cancel from OUTSIDE this group, which released that run instantly.
# warn_site_check.py --publish does exactly that, from monitor.yml and
# site-watchdog.yml, whenever the live site is behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bounds a hung runner step only — not a wait on the environment (above).
    timeout-minutes: 20
    # Required: the Pages API rejects a deployment from a job without one.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
