name: Send Test WARN Alert

# Manual-only utility: sends ONE sample alert email to NOTIFY_EMAIL and BCCs the
# live subscriber list (fetched from the signup Sheet). Use it to verify email +
# subscriber delivery on demand. It never runs automatically. Safe to delete.
on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: pip install requests python-dotenv

      - name: Send test alert (To NOTIFY_EMAIL + BCC subscribers)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SIGNUP_ENDPOINT: ${{ vars.SIGNUP_ENDPOINT }}
          SUBSCRIBERS_TOKEN: ${{ secrets.SUBSCRIBERS_TOKEN }}
        run: python3 warn_notify.py --test
